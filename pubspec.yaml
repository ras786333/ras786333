name: mobile_shop
description: A mobile shop application.
publish_to: 'https://github.com/yourusername/mobile_shop'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  url_launcher: ^6.1.12
  intl: ^0.18.1
  cached_network_image: ^3.2.3
  share_plus: ^7.1.0
  image_picker: ^1.0.4
  uuid: ^4.2.1
  shared_preferences: ^2.2.0
  font_awesome_flutter: ^10.5.0
  firebase_core: ^2.15.1
  cloud_firestore: ^4.8.5
  firebase_crashlytics: ^3.3.4
  http: ^1.1.0
  flutter_native_splash: ^2.4.5
  flutter_launcher_icons: ^0.13.1
  firebase_auth: ^4.7.2
  firebase_storage: ^11.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/banners/

# Flutter Native Splash Screen Configuration
flutter_native_splash:
  color: "#0277BD"
  image: null
  color_dark: "#0D47A1"
  image_dark: null
  
  android_12:
    icon_background_color: "#0277BD"
    icon_background_color_dark: "#0D47A1"
    
  android: true
  ios: true
  web: false

  # Icon mode for splash screen
  icon_background_color: "#0277BD"
  icon_background_color_dark: "#0D47A1"
  
  # Display until the app is fully loaded
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

# Flutter Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  remove_alpha_ios: true 